name: build-and-test

on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and Renode (same script as Codespaces)
        run: bash .devcontainer/setup.sh
      - name: Build firmware
        run: make
      # main of this repository is the unfinished starter, so its tests are
      # expected to fail. Everywhere else (the solution branch, students'
      # own copies) the tests check the work.
      - name: Run the Renode test
        if: github.repository != 'bernininini/can-bus-onboarding' || github.ref_name != 'main'
        run: make test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-test-report
          path: |
            log.html
            report.html
            robot_output.xml
